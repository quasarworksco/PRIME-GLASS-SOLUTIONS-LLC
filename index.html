<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Glass Solutions</title>
<meta name="description" content="Prime Glass Solutions LLC. Nuestro nuevo sitio web estará disponible muy pronto.">
<meta name="theme-color" content="#05070B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070B;--text:#F5F8FD;--muted:#A9B6C9;--dim:#7F8DA3;--blue:#2F6BFF;--accent:#4F8BFF;--line:rgba(148,178,220,.12);--line2:rgba(148,178,220,.22);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grid{position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);opacity:.6;animation:gridIn 2s var(--ease) both}
@keyframes gridIn{from{opacity:0;transform:scale(1.06)}}
.pane{position:fixed;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.025);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:6px;pointer-events:none;animation:float 12s ease-in-out infinite}
.pane::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.12) 50%,transparent 58%);background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
.p1{width:180px;height:300px;top:12%;left:8%;--r:-10deg;animation-delay:-2s}
.p2{width:130px;height:220px;bottom:10%;right:9%;--r:12deg;animation-delay:-6s}
.p3{width:90px;height:150px;top:16%;right:20%;--r:6deg;animation-delay:-9s;opacity:.6}
@keyframes float{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r)*-1)) translateY(-22px)}}
@keyframes sheen{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px}
.mark{width:72px;height:72px;border-radius:20px;background:var(--blue);display:grid;place-items:center;font-family:"Sora",sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;color:#fff;box-shadow:0 20px 50px -18px rgba(47,107,255,.8);position:relative;animation:pop 1s cubic-bezier(.3,1.5,.5,1) .2s both}
.mark::after{content:"";position:absolute;inset:-8px;border-radius:26px;border:1px solid var(--accent);opacity:0;animation:ring 2.6s ease-out 1.4s infinite}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.name{margin-top:22px;font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:0;animation:up .9s var(--ease) .5s forwards}
h1{font-family:"Sora",sans-serif;font-weight:600;font-size:clamp(40px,10vw,108px);letter-spacing:-.04em;line-height:1;margin:18px 0 20px}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em}
h1 .w span{display:inline-block;transform:translateY(105%);animation:word 1.1s var(--ease) forwards;animation-delay:calc(.7s + var(--i)*.06s)}
h1 .dot{color:var(--accent)}
@keyframes word{to{transform:none}}
p{max-width:520px;color:var(--muted);font-size:clamp(16px,2vw,18px);line-height:1.6;opacity:0;animation:up .9s var(--ease) 1.3s forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.bar{width:min(320px,80vw);height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:36px auto 0;overflow:hidden;opacity:0;animation:up .9s var(--ease) 1.5s forwards}
.bar i{display:block;height:100%;width:35%;border-radius:3px;background:var(--blue);animation:load 2.4s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:36px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:14px;color:var(--muted);opacity:0;animation:up .8s var(--ease) forwards;animation-delay:calc(1.7s + var(--i)*.1s)}
.chip svg{color:var(--accent);font-size:16px}
footer{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--dim);z-index:1;opacity:0;animation:up .8s var(--ease) 2.3s forwards}
@media (max-width:600px){.p1{left:-40px;top:6%}.p3{display:none}.p2{right:-30px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-door" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="1"/><path d="M5 22h14M9 6l6 6M9 10l4 4"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M12 3v18M3 12h18"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
</svg>
<div class="grid" aria-hidden="true"></div>
<div class="pane p1" aria-hidden="true"></div><div class="pane p2" aria-hidden="true"></div><div class="pane p3" aria-hidden="true"></div>
<main>
  <div class="mark" aria-hidden="true">PG</div>
  <div class="name">Prime Glass Solutions LLC</div>
  <h1><span class="w"><span style="--i:0">Próximamente</span></span><span class="w"><span style="--i:1" class="dot">.</span></span></h1>
  <p>Estamos preparando nuestro nuevo sitio web. Muy pronto podrá conocer nuestros servicios y solicitar su cotización en línea.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="chips">
    <span class="chip" style="--i:0"><svg class="i"><use href="#i-door"/></svg>Puertas de ducha</span>
    <span class="chip" style="--i:1"><svg class="i"><use href="#i-window"/></svg>Ventanas</span>
    <span class="chip" style="--i:2"><svg class="i"><use href="#i-building"/></svg>Storefronts</span>
    <span class="chip" style="--i:3"><svg class="i"><use href="#i-image"/></svg>Espejos</span>
  </div>
</main>
<footer>© 2026 Prime Glass Solutions LLC</footer>
</body>
</html>
